name: Refresh latest release badge

on:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-badge
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Refresh and commit the release badge
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 docs/update-badges.py --repo "$GITHUB_REPOSITORY" --commit-to-branch "$DEFAULT_BRANCH"
