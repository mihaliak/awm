name: Refresh latest release badge

on:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-badge
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Read the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 docs/update-badges.py --repo "$GITHUB_REPOSITORY"
      - name: Commit a changed badge
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- docs/latest-release.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/latest-release.svg
          git commit -m 'chore(docs): refresh release badge'
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
